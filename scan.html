<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        #reader {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            display: none;
        }
        .status {
            margin: 20px;
            padding: 10px;
            text-align: center;
        }
        .success {
            background-color: #dff0d8;
            color: #3c763d;
        }
        .error {
            background-color: #f2dede;
            color: #a94442;
        }
        #loginContainer {
            text-align: center;
            margin: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        #userInfo {
            display: none;
            text-align: right;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="userInfo">
            <span id="userName"></span>
            <button onclick="handleSignOut()">Sign Out</button>
        </div>
        <div id="loginContainer">
            <div id="g_id_onload"
                data-client_id="YOUR_GOOGLE_CLIENT_ID"
                data-context="signin"
                data-ux_mode="popup"
                data-callback="handleCredentialResponse"
                data-auto_prompt="false">
            </div>

            <div class="g_id_signin"
                data-type="standard"
                data-shape="rectangular"
                data-theme="outline"
                data-text="signin_with"
                data-size="large"
                data-logo_alignment="left">
            </div>
        </div>

        <div id="reader"></div>
        <div id="status" class="status"></div>
    </div>

    <script>
        let accessToken = null;
        let html5QrcodeScanner = null;

        function handleCredentialResponse(response) {
            // Send the token to your worker to exchange it for an access token
            fetch('https://your-worker.workers.dev/auth', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ credential: response.credential })
            })
            .then(response => response.json())
            .then(data => {
                accessToken = data.access_token;
                document.getElementById('loginContainer').style.display = 'none';
                document.getElementById('reader').style.display = 'block';
                document.getElementById('userInfo').style.display = 'block';
                document.getElementById('userName').textContent = data.email;
                
                // Initialize QR scanner after successful login
                initializeScanner();
            })
            .catch(error => {
                showStatus('Authentication failed: ' + error.message, 'error');
            });
        }

        function handleSignOut() {
            google.accounts.id.disableAutoSelect();
            accessToken = null;
            if (html5QrcodeScanner) {
                html5QrcodeScanner.clear();
            }
            document.getElementById('loginContainer').style.display = 'block';
            document.getElementById('reader').style.display = 'none';
            document.getElementById('userInfo').style.display = 'none';
            document.getElementById('status').textContent = '';
        }

        function initializeScanner() {
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", { fps: 10, qrbox: 250 }
            );
            html5QrcodeScanner.render(onScanSuccess);
        }

        function onScanSuccess(decodedText) {
            // Stop scanner
            html5QrcodeScanner.clear();
            
            // Get geolocation
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const data = {
                        qrCode: decodedText,
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude,
                        timestamp: new Date().toISOString()
                    };

                    try {
                        const response = await fetch('https://your-worker.workers.dev/scan', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${accessToken}`
                            },
                            body: JSON.stringify(data)
                        });

                        if (response.ok) {
                            showStatus('Scan recorded successfully!', 'success');
                        } else {
                            showStatus('Failed to record scan', 'error');
                        }
                    } catch (error) {
                        showStatus('Error: ' + error.message, 'error');
                    }
                },
                (error) => {
                    showStatus('Error getting location: ' + error.message, 'error');
                }
            );
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
        }
    </script>
</body>
</html>
